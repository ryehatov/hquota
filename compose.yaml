name: hquota

services:
  hquota:
    image: hquota-broker:local
    container_name: hermes-hquota
    build:
      context: .
      target: broker
    user: "${HERMES_UID:?run sh ./compose-setup.sh first}:${HERMES_GID:?run sh ./compose-setup.sh first}"
    command: ["serve", "--config", "/etc/hquota/config.json"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./run/hquota:/run/hquota
      - ./config.json:/etc/hquota/config.json:ro
      - ${CODEX_BUSINESS_HOME:?run sh ./compose-setup.sh first}:/credentials/codex/business:ro
      - ${CODEX_PERSONAL_HOME:?run sh ./compose-setup.sh first}:/credentials/codex/personal:ro
    secrets:
      - command-code-goat

  gateway:
    profiles: [hermes]
    image: hermes-hquota:local
    build:
      context: .
      target: hermes
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:latest}
    user: "${HERMES_UID}:${HERMES_GID}"
    environment:
      HOME: /home/hermes
      HERMES_HOME: /home/hermes/.hermes
    volumes:
      - ${HERMES_DATA_DIR:-${HOME}/.hermes}:/home/hermes/.hermes
      - ./skills/quota:/home/hermes/.hermes/skills/quota:ro
      - ./run/hquota:/run/hquota
    depends_on:
      - hquota

secrets:
  command-code-goat:
    file: ${COMMAND_CODE_KEY_FILE:?run sh ./compose-setup.sh first}
