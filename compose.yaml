name: hquota

services:
  hquota:
    image: hquota:local
    build: .
    restart: unless-stopped
    user: "${HOST_UID:?run ./compose-setup.sh first}:${HOST_GID:?run ./compose-setup.sh first}"
    command: ["serve", "--config", "/etc/hquota/config.json"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./run/hquota:/run/hquota
      - ./config.json:/etc/hquota/config.json:ro
      - ${CODEX_BUSINESS_HOME:?run ./compose-setup.sh first}:/credentials/codex/business:ro
      - ${CODEX_PERSONAL_HOME:?run ./compose-setup.sh first}:/credentials/codex/personal:ro
    secrets:
      - command-code-goat

secrets:
  command-code-goat:
    file: ./secrets/command-code-goat
