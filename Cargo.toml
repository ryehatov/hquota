[package]
name = "hquota"
version = "0.1.0"
edition = "2024"
description = "On-demand Codex and Command Code quota for humans and Hermes"
license = "MIT"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
